name: Temporary ATS formatter
on:
  push:
    branches:
      - feat/public-ats-discovery
    paths:
      - .github/workflows/format-public-ats.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/25_PublicATSDiscovery.js tests/publicAtsDiscovery.test.js
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/25_PublicATSDiscovery.js tests/publicAtsDiscovery.test.js
          if ! git diff --cached --quiet; then
            git commit -m "style: format public ATS files"
            git push
          fi
