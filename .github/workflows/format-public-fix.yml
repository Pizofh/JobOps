name: Temporary Public Fix Formatter
on:
  push:
    branches:
      - fix/public-discovery-priority-and-bridge-matches
    paths:
      - .github/workflows/format-public-fix.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/25_PublicATSDiscovery.js tests/publicAtsDiscovery.test.js
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/25_PublicATSDiscovery.js tests/publicAtsDiscovery.test.js
          if ! git diff --cached --quiet; then
            git commit -m "style: format discovery priority fix"
            git pull --rebase origin fix/public-discovery-priority-and-bridge-matches
            git push
          fi
