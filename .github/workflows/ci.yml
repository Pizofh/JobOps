name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Show fit formatting diffs
        run: |
          for f in src/23_FitAssessment.js src/24_FitMigration.js; do
            npx prettier "$f" > /tmp/formatted
            diff -u "$f" /tmp/formatted || true
          done
      - name: Validate
        run: npm run ci
