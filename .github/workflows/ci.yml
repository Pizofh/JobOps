name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format probe
        run: |
          npx prettier --write src/15_GeminiService.js tests/scoringCalibration.test.js
          echo "GEMINI_B64=$(base64 -w0 src/15_GeminiService.js)"
          echo "CAL_B64=$(base64 -w0 tests/scoringCalibration.test.js)"
          exit 1
      - name: Validate
        run: npm run ci
