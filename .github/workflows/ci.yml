name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format probe
        run: |
          npx prettier --write tests/semanticClassification.test.js tests/setupIntegration.test.js tests/webApp.test.js
          echo "SEM_B64=$(base64 -w0 tests/semanticClassification.test.js)"
          echo "SETUP_B64=$(base64 -w0 tests/setupIntegration.test.js)"
          echo "WEB_B64=$(base64 -w0 tests/webApp.test.js)"
          exit 1
      - name: Validate
        run: npm run ci
