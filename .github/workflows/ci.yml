name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dump formatted files
        run: |
          for f in docs/OPERATIONS.md src/22_WebApp.js tests/webApp.test.js; do
            echo "FILE:$f"
            npx prettier "$f" | base64 -w0
            echo
          done
      - name: Validate
        run: npm run ci
